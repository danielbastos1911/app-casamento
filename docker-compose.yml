services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://casamento:casamento@db:5432/casamento?schema=public"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: casamento
      POSTGRES_PASSWORD: casamento
      POSTGRES_DB: casamento
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casamento -d casamento"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
